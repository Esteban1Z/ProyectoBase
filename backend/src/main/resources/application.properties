# Railway sets PORT, MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER and MYSQLPASSWORD.
server.port=${PORT:8080}
spring.datasource.url=jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:papeleria_db}}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.seed.test-user.enabled=${SEED_TEST_USER_ENABLED:false}
app.seed.test-user.email=${SEED_TEST_USER_EMAIL:pruebas@papelsoft.com}
app.seed.test-user.password=${SEED_TEST_USER_PASSWORD:}
app.jwt.secret=${JWT_SECRET:}
app.jwt.lifetime-seconds=${JWT_LIFETIME_SECONDS:28800}
